name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  orm-unit-and-build:
    name: Unit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Test
      run: go test -v ./orm

    - name: Vet
      run: go vet ./orm

    - name: Build
      run: go build ./cmd/jango

  postgres-integration-tests:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: jango_test
          POSTGRES_USER: jango
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jango -d jango_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v6

    - name: Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Test
      env:
        DATABASE_URL: postgres://jango:password@localhost:5432/jango_test?sslmode=disable
      run: go test -count=1 -v ./orm -run TestIntegration
